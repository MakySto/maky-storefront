"""
Atomically stores a B2B VAT verification for the current checkout context, decides the § 43 exemption, sets the native tax exemption and invalidates prices. Requires an active app with both MANAGE_TAXES and HANDLE_TAXES. MAKY fork only (contract MAKY-B2B-V1).
"""
type CheckoutB2bTaxAttestationUpdate {
  """An updated checkout."""
