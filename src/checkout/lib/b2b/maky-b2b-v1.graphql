"""
Decision of the MAKY automatic B2B § 43 workflow. `TAXED_*` means the automatic exemption is not used and the regular Saleor calculation applies.
"""
enum B2bTaxDecision {
  EXEMPT
  TAXED_NOT_COMPANY
  TAXED_NO_VAT_ID
  TAXED_SK_VAT
  TAXED_DOMESTIC_DELIVERY
  TAXED_COUNTRY_MISMATCH
  TAXED_UNVERIFIED
  TAXED_INVALID
  TAXED_UNAVAILABLE
  TAXED_IDENTITY_REVIEW
  TAXED_STALE
  TAXED_DISABLED
  OUT_OF_SCOPE
}

"""Summary of the B2B tax state. MAKY fork only (MAKY-B2B-V1)."""
type B2bTaxState {
  """
  Opaque version of the current B2B context and revision. Pass it unchanged as `expectedContextVersion`.
  """
  contextVersion: String!

  """Current decision."""
  decision: B2bTaxDecision!

  """
  Whether the MAKY B2B § 43 exemption is effective for the prices of this checkout.
  """
  effectiveTaxExemption: Boolean!

  """Original time of the stored VIES check."""
  checkedAt: DateTime

  """Time when a VALID check stops being usable."""
  expiresAt: DateTime

  """
  True while a started payment freezes the tax context; company, VAT, address and delivery changes are rejected.
  """
  paymentLocked: Boolean!
}

"""Result of a VIES VAT verification."""
enum B2bVatVerificationStatus {
  VALID
  INVALID
  UNAVAILABLE
}

type CheckoutB2bTaxAttestationError {
  """
