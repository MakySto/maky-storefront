fragment OrderFullDetails on Order {
	id
	number
	created
	status
	statusDisplay
	paymentStatus
	isPaid
	shippingAddress {
		...AddressDetails
	}
	billingAddress {
		...AddressDetails
	}
	subtotal {
		gross {
			amount
			currency
		}
	}
	shippingPrice {
		gross {
			amount
			currency
		}
	}
	total {
		gross {
			amount
			currency
		}
		tax {
			amount
			currency
		}
	}
	lines {
		id
		quantity
		# The tyre size the customer chose on a snow chain or sock, copied from the cart line (`lib/tyre-size`).
		metadata {
			key
			value
		}
		# What the order was placed under, in the order's language; the fallback when the product
		# has no translation (any more) in the language of the market the page is read in.
		translatedProductName
		translatedVariantName
		variant {
			id
			name
			translation(languageCode: $languageCode) {
				name
			}
			product {
				id
				name
				slug
				translation(languageCode: $languageCode) {
					name
					slug
				}
				thumbnail {
					url
					alt
				}
			}
			pricing {
				price {
					gross {
						amount
						currency
					}
				}
			}
		}
	}
	fulfillments {
		id
		status
		created
		trackingNumber
		lines {
			id
			quantity
			orderLine {
				id
			}
		}
	}
}

query OrderByNumber($first: Int, $languageCode: LanguageCodeEnum! = SK) {
	me {
		orders(first: $first) {
			edges {
				node {
					...OrderFullDetails
				}
			}
		}
	}
}
