# The maker and the volume of every product a category listing holds in a channel, for the
# listing's "Značka" and "Objem" filters and their counts. Read only when the listing is small
# enough to read whole; see `src/lib/listing/category-facets.ts`. Read-only.
query CategoryFacets($slug: String!, $channel: String!, $first: Int!, $after: String) {
	category(slug: $slug) {
		products(channel: $channel, first: $first, after: $after) {
			totalCount
			pageInfo {
				hasNextPage
				endCursor
			}
			edges {
				node {
					brand: attribute(slug: "manufacturer") {
						values {
							slug
							name
						}
					}
					volume: attribute(slug: "volume") {
						values {
							name
						}
					}
				}
			}
		}
	}
}
