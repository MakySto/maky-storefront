query ProductDetails($slug: String!, $channel: String!) {
	product(slug: $slug, channel: $channel) {
		id
		name
		slug
		description
		seoTitle
		seoDescription
		thumbnail(size: 1024, format: WEBP) {
			url
			alt
		}
		media {
			url(size: 1024, format: WEBP)
			alt
			type
		}
		category {
			id
			name
			slug
		}
		rating
		attributes {
			values {
				name
			}
			attribute {
				name
				slug
				# Stable CFM key ("cfm:attribute:max_load") — units are mapped on
				# this, never on the display name, which is translatable.
				externalReference
				inputType
				# Saleor's native measurement unit. Currently null on every CFM
				# attribute, and MeasurementUnitsEnum has no speed unit at all,
				# so the local map is the working source. Preferred when set.
				unit
			}
		}
		variants {
			...VariantDetails
		}
		pricing {
			priceRange {
				start {
					gross {
						amount
						currency
					}
				}
				stop {
					gross {
						amount
						currency
					}
				}
			}
		}
	}
}
