query ProductDetails(
	$slug: String!
	$channel: String!
	$lang: LanguageCodeEnum!
	$slugLang: LanguageCodeEnum
) {
	product(slug: $slug, channel: $channel, slugLanguageCode: $slugLang) {
		id
		isAvailableForPurchase
		name
		slug
		description
		seoTitle
		seoDescription
		translation(languageCode: $lang) {
			name
			slug
			description
			seoTitle
			seoDescription
		}
		thumbnail(size: 1024, format: WEBP) {
			url
			alt
		}
		media {
			id
			url
			sortOrder
			alt
			type
			# The gallery's own copy of a photograph at 1024 px, the size Saleor keeps nearest to a description column (`lib/gallery-photos.ts`).
			photo: url(size: 1024, format: WEBP)
			# CFM leaves the address a gallery photo came from here (`cfm_source_url`); the description's photographs are found by it.
			metadata {
				key
				value
			}
		}
		category {
			id
			name
			slug
			translation(languageCode: $lang) {
				name
				slug
			}
		}
		rating
		attributes {
			values {
				name
				# The value's own key — the maker's brand page is `/znacky/<slug>`.
				slug
				# A BOOLEAN attribute's value is named "<attribute>: Yes" by Saleor; the flag is
				# what the parameters table reads, as "Áno"/"Nie" in the market's language.
				boolean
				translation(languageCode: $lang) {
					name
				}
			}
			attribute {
				name
				slug
				translation(languageCode: $lang) {
					name
				}
				# Stable CFM key ("cfm:attribute:max_load") — units are mapped on
				# this, never on the display name, which is translatable.
				externalReference
				inputType
				# Saleor's native measurement unit. Currently null on every CFM
				# attribute, and MeasurementUnitsEnum has no speed unit at all,
				# so the local map is the working source. Preferred when set.
				unit
			}
		}
		variants {
			...VariantDetails
		}
		pricing {
			priceRange {
				start {
					gross {
						amount
						currency
					}
				}
				stop {
					gross {
						amount
						currency
					}
				}
			}
		}
	}
}
