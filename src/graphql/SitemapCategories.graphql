# Category slugs with a per-channel product count, so the sitemap can leave out
# the empty ones. Eleven of the thirty categories on this catalogue currently
# hold no products in sk-eur, `stresne-nosice` among them.
#
# Paginated for the same reason the product query is: a fixed `first` with no
# `pageInfo` cannot even tell that it truncated.
query SitemapCategories($channel: String!, $first: Int!, $after: String) {
	categories(first: $first, after: $after) {
		edges {
			node {
				slug
				products(channel: $channel) {
					totalCount
				}
			}
		}
		pageInfo {
			hasNextPage
			endCursor
		}
	}
}
