query ProductListByCollection(
	$slug: String!
	$channel: String!
	$lang: LanguageCodeEnum!
	$slugLang: LanguageCodeEnum
	$first: Int
	$after: String
	$last: Int
	$before: String
	$sortBy: ProductOrder
	$filter: ProductFilterInput
) {
	collection(slug: $slug, channel: $channel, slugLanguageCode: $slugLang) {
		id
		name
		slug
		description
		seoDescription
		seoTitle
		translation(languageCode: $lang) {
			name
			slug
			description
			seoDescription
			seoTitle
		}
		backgroundImage {
			url
			alt
		}
		products(first: $first, after: $after, last: $last, before: $before, sortBy: $sortBy, filter: $filter) {
			edges {
				node {
					...ProductListItem
				}
				cursor
			}
			pageInfo {
				hasNextPage
				hasPreviousPage
				startCursor
				endCursor
			}
			totalCount
		}
	}
}
