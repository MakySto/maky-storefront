fragment VariantDetails on ProductVariant {
	id
	name
	sku
	sourceSku: metafield(key: "cfm_source_sku")
	quantityAvailable
	# Distinguishes real warehouse stock from Saleor's synthetic checkout cap when
	# inventory tracking is disabled. A tracked positive quantity must win over a
	# stale sale-to-order metafield.
	trackInventory
	# CFM publishes availability here, not on the product.
	metafield(key: "cfm_availability_mode")
	selectionAttributes: attributes(variantSelection: VARIANT_SELECTION) {
		values {
			name
			value
			translation(languageCode: $lang) {
				name
			}
		}
		attribute {
			name
			slug
			translation(languageCode: $lang) {
				name
			}
		}
	}
	nonSelectionAttributes: attributes(variantSelection: NOT_VARIANT_SELECTION) {
		values {
			name
			value
			translation(languageCode: $lang) {
				name
			}
		}
		attribute {
			name
			slug
			translation(languageCode: $lang) {
				name
			}
		}
	}
	media {
		id
		url
		sortOrder
		alt
		type
	}
	pricing {
		price {
			gross {
				currency
				amount
			}
		}
		priceUndiscounted {
			gross {
				currency
				amount
			}
		}
	}
}
