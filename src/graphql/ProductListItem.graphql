fragment ProductListItem on Product {
	id
	name
	slug
	translation(languageCode: $lang) {
		name
		slug
		description
		seoTitle
		seoDescription
	}
	created
	# Saleor's own review score. Null across the whole catalogue today — there is
	# no review system — so the card renders stars only when it is populated.
	rating
	attributes {
		attribute {
			name
			slug
			externalReference
			unit
			translation(languageCode: $lang) {
				name
			}
		}
		values {
			name
			translation(languageCode: $lang) {
				name
			}
		}
	}
	pricing {
		priceRange {
			start {
				gross {
					amount
					currency
				}
			}
			stop {
				gross {
					amount
					currency
				}
			}
		}
		priceRangeUndiscounted {
			start {
				gross {
					amount
					currency
				}
			}
			stop {
				gross {
					amount
					currency
				}
			}
		}
	}
	category {
		id
		name
		slug
		translation(languageCode: $lang) {
			name
			slug
		}
	}
	thumbnail(size: 1024, format: WEBP) {
		url
		alt
	}
	variants {
		id
		sku
		# The customer-visible product code. `sku` is the integration identity and
		# carries a CFM-internal suffix on the bundle products, so the card used to
		# print that suffix under a "SKU:" label. See src/lib/product-code.ts.
		name
		quantityAvailable
		# Availability is CFM-owned and published on the VARIANT, not the product
		# (verified live: 100/100 variants carry it, 0/100 products do). Reading
		# it from the product would silently render no badge at all.
		metafield(key: "cfm_availability_mode")
		selectionAttributes: attributes(variantSelection: VARIANT_SELECTION) {
			attribute {
				slug
				name
				translation(languageCode: $lang) {
					name
				}
			}
			values {
				name
				value
				translation(languageCode: $lang) {
					name
				}
			}
		}
	}
}
