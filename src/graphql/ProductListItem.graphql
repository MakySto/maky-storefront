fragment ProductListItem on Product {
	id
	name
	slug
	created
	# Availability is CFM-owned. Read from the PRODUCT, not the variants: a
	# listing renders dozens of cards and fetching variant metadata for each one
	# just to draw a badge is a needless cost.
	metafield(key: "cfm_availability_mode")
	attributes {
		attribute {
			name
			externalReference
			unit
		}
		values {
			name
		}
	}
	pricing {
		priceRange {
			start {
				gross {
					amount
					currency
				}
			}
			stop {
				gross {
					amount
					currency
				}
			}
		}
		priceRangeUndiscounted {
			start {
				gross {
					amount
					currency
				}
			}
			stop {
				gross {
					amount
					currency
				}
			}
		}
	}
	category {
		id
		name
		slug
	}
	thumbnail(size: 1024, format: WEBP) {
		url
		alt
	}
	variants {
		id
		sku
		quantityAvailable
		selectionAttributes: attributes(variantSelection: VARIANT_SELECTION) {
			attribute {
				slug
				name
			}
			values {
				name
				value
			}
		}
	}
}
