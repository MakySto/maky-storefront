fragment ProductListItem on Product {
	id
	isAvailableForPurchase
	name
	slug
	translation(languageCode: $lang) {
		name
		slug
		description
		seoTitle
		seoDescription
	}
	created
	# Saleor's own review score. Null across the whole catalogue today — there is
	# no review system — so the card renders stars only when it is populated.
	rating
	attributes {
		attribute {
			name
			slug
			externalReference
			unit
			translation(languageCode: $lang) {
				name
			}
		}
		values {
			name
			translation(languageCode: $lang) {
				name
			}
		}
	}
	pricing {
		priceRange {
			start {
				gross {
					amount
					currency
				}
			}
			stop {
				gross {
					amount
					currency
				}
			}
		}
		priceRangeUndiscounted {
			start {
				gross {
					amount
					currency
				}
			}
			stop {
				gross {
					amount
					currency
				}
			}
		}
	}
	category {
		id
		name
		slug
		translation(languageCode: $lang) {
			name
			slug
		}
	}
	# Temporary high-quality escape hatch for legacy Menabo imports. Their source
	# filenames were imported as `_thumbnail_4`, so Saleor's 1024/WEBP resolver
	# serves a physical 128px file. ORIGINAL returns the real 900–1400px source;
	# next/image still sends each browser only the requested display width. Once
	# CFM reimports those media with neutral source names, this can return to a
	# normal 1024px rendition.
	thumbnail(size: 4096, format: ORIGINAL) {
		url
		alt
	}
	# The gallery's stored files, for the card to fall back on when the thumbnail is the
	# imported grey "no image" GIF: 15 of the 414 non-roof-rack products in sk-eur carry it
	# FIRST and their real photos after it (2026-09-24), so their cards said "no image" over
	# a gallery of ten. Aliased so it never merges with a query's own `media` selection.
	cardMedia: media {
		url
	}
	variants {
		id
		sku
		# The customer-visible product code. `sku` is the integration identity and
		# carries a CFM-internal suffix on the bundle products, so the card used to
		# print that suffix under a "SKU:" label. See src/lib/product-code.ts.
		name
		quantityAvailable
		# Needed alongside quantityAvailable: when false, Saleor can return a
		# synthetic checkout cap rather than physical warehouse stock.
		trackInventory
		# Availability is CFM-owned and published on the VARIANT, not the product
		# (verified live: 100/100 variants carry it, 0/100 products do). Reading
		# it from the product would silently render no badge at all.
		metafield(key: "cfm_availability_mode")
		selectionAttributes: attributes(variantSelection: VARIANT_SELECTION) {
			attribute {
				slug
				name
				translation(languageCode: $lang) {
					name
				}
			}
			values {
				name
				value
				translation(languageCode: $lang) {
					name
				}
			}
		}
	}
}
